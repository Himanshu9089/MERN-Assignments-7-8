
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <header class="header">
            <h2>HEADER / STUDENT DASHBOARD</h2>
            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <aside class="sidebar">
            <h2>SIDEBAR</h2>
            <p>Overview</p>
            <p>Courses</p>
            <p>Assignments</p>
            <p>Settings</p>
        </aside>

        <main class="main">
            <h2>MAIN / Learning overview</h2>

            <div class="course-grid">
                <div class="course">
                    <h3>HTML</h3>
                    <p>8 lessons</p>
                </div>

                <div class="course">
                    <h3>CSS</h3>
                    <p>12 lessons</p>
                </div>

                <div class="course">
                    <h3>Projects</h3>
                    <p>3 active</p>
                </div>
            </div>

            <p>Your learning activity appears here.</p>
        </main>

        <footer class="footer">
            <h3>FOOTER / CAMPUS LEARNING PORTAL</h3>
            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </nav>
        </footer>

    </div>

</body>
</html>
